  <script>
    /* Drop a production worker that predates the premium shell.
       Legacy /sw.js cache-firsts scripts. A controlling worker that does not
       report version 7 is unregistered once and its fairwayweather caches are
       deleted, then the page reloads from the network. */
    (function () {
      if (!("serviceWorker" in navigator)) return;
      var KEY = "fw-sw-prod-v7";
      if (sessionStorage.getItem(KEY) === "ok") return;
      var controller = navigator.serviceWorker.controller;
      if (!controller) {
        sessionStorage.setItem(KEY, "ok");
        return;
      }
      document.documentElement.classList.add("fw-sw-check");
      var settled = false;
      function fresh() {
        if (settled) return;
        settled = true;
        sessionStorage.setItem(KEY, "ok");
        document.documentElement.classList.remove("fw-sw-check");
      }
      function wipe() {
        if (settled) return;
        settled = true;
        var again = sessionStorage.getItem(KEY) === "1";
        sessionStorage.setItem(KEY, "1");
        var clear = window.caches
          ? caches.keys().then(function (keys) {
              return Promise.all(
                keys
                  .filter(function (k) { return k.indexOf("fairwayweather") === 0; })
                  .map(function (k) { return caches.delete(k); })
              );
            })
          : Promise.resolve();
        clear.catch(function () {}).then(function () {
          return navigator.serviceWorker.getRegistrations();
        }).then(function (regs) {
          return Promise.all(
            (regs || [])
              .filter(function (reg) {
                try { return !/\/dev\/$/i.test(new URL(reg.scope).pathname); }
                catch (e) { return true; }
              })
              .map(function (reg) { return reg.unregister(); })
          );
        }).finally(function () {
          if (!again) location.reload();
          else document.documentElement.classList.remove("fw-sw-check");
        });
      }
      var channel = new MessageChannel();
      channel.port1.onmessage = function (event) {
        if (event.data && event.data.version === 7) fresh();
        else wipe();
      };
      try {
        controller.postMessage({ type: "fw-sw-version" }, [channel.port2]);
      } catch (e) {
        wipe();
        return;
      }
      setTimeout(function () {
        if (!settled) wipe();
      }, 800);
    })();
  </script>
