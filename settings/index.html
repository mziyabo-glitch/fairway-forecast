  <script>
    /* If a controlling worker handed us something other than this shell,
       drop every registration and reload once. The legacy document does
       not contain this script — /sw.js taking control is what replaces it. */
    (function () {
      var KEY = "fw-shell-reload";
      try {
        var cur = new URL(location.href);
        if (cur.searchParams.has("fw_shell")) {
          cur.searchParams.delete("fw_shell");
          history.replaceState(history.state, "", cur.pathname + cur.search + cur.hash);
        }
      } catch (e) {}
      if (!("serviceWorker" in navigator)) return;
      if (!navigator.serviceWorker.controller) return;
      if (document.documentElement.getAttribute("data-fw-shell") === "premium") return;
      try {
        if (sessionStorage.getItem(KEY) === "1") return;
        sessionStorage.setItem(KEY, "1");
      } catch (e) {
        return;
      }
      var clear = window.caches
        ? caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          })
        : Promise.resolve();
      clear.catch(function () {}).then(function () {
        return navigator.serviceWorker.getRegistrations();
      }).then(function (regs) {
        return Promise.all((regs || []).map(function (reg) { return reg.unregister(); }));
      }).then(function () { location.reload(); }, function () { location.reload(); });
    })();
  </script>
