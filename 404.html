<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fairway Weather</title>
  <script>
    (function () {
      var p = location.pathname;
      var isDev = /^\/dev(\/|$)/.test(p);
      var isDevIndex = /\/dev\/index\.html$/i.test(p);
      var isAsset = /\.(css|js|json|webmanifest|png|jpe?g|svg|ico|woff2?|txt|xml|map)$/i.test(p);

      if (isDev && !isDevIndex && !isAsset) {
        sessionStorage.setItem("fwDevRestorePath", p + location.search + location.hash);
        location.replace("/dev/index.html");
        return;
      }

      if (!isDev) {
        location.replace("/");
      }
    })();
  </script>
</head>
<body>
  <p><a href="/">Return to Fairway Weather</a></p>
</body>
</html>
